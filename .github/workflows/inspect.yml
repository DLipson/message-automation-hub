name: Inspect

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect-stage:
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' && vars.GCP_PROJECT_ID != '' && vars.STAGING_GCP_ZONE != '' && vars.STAGING_GCP_INSTANCE != ''
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Dump app and container state
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ vars.STAGING_GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.STAGING_GCP_INSTANCE }}
        run: |
          set -euo pipefail
          gcloud compute ssh "$GCP_INSTANCE" \
            --project "$GCP_PROJECT_ID" \
            --zone "$GCP_ZONE" \
            --quiet \
            --command '
              docker ps --format "{{.Names}}\t{{.Status}}"
              echo "=== docker logs (tail 200) ==="
              docker logs message-automation-hub --tail 200 --timestamps 2>&1 || true
              echo "=== journald (docker unit, tail 50) ==="
              journalctl _SYSTEMD_UNIT=docker.service --no-pager -n 50 2>&1 || true
            '