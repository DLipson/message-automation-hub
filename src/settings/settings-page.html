<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Message Automation Hub</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #5e6b78;
        --line: #d9dee5;
        --primary: #176b5f;
        --primary-hover: #11554b;
        --danger: #a23535;
        --danger-hover: #812b2b;
        --focus: #2f7de1;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }

      main {
        max-width: 1120px;
        margin: 0 auto;
        padding: 28px 18px 36px;
      }

      header {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        align-items: flex-start;
        margin-bottom: 22px;
      }

      h1 {
        font-size: 26px;
        line-height: 1.2;
        margin: 0 0 6px;
        font-weight: 650;
      }

      h2 {
        font-size: 17px;
        margin: 0 0 16px;
      }

      p {
        margin: 0;
      }

      .muted {
        color: var(--muted);
        font-size: 14px;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr);
        gap: 16px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      .stack {
        display: grid;
        gap: 16px;
      }

      form {
        display: grid;
        gap: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      input,
      select {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        background: #fff;
        padding: 8px 10px;
        font: inherit;
      }

      input:focus,
      select:focus,
      button:focus {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .section-heading {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }

      .section-heading h2 {
        margin: 0;
      }

      button {
        border: 1px solid transparent;
        border-radius: 6px;
        min-height: 38px;
        padding: 8px 12px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.62;
      }

      .primary {
        background: var(--primary);
        color: #fff;
      }

      .primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      .secondary {
        background: #fff;
        color: var(--text);
        border-color: var(--line);
      }

      .danger {
        background: var(--danger);
        color: #fff;
      }

      .danger:hover:not(:disabled) {
        background: var(--danger-hover);
      }

      .status {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 650;
        background: #fff;
      }

      .notice {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .notice.error {
        color: var(--danger);
      }

      pre {
        min-height: 260px;
        max-height: 460px;
        overflow: auto;
        margin: 0;
        padding: 12px;
        border-radius: 6px;
        background: #121820;
        color: #dbe7f3;
        font: 13px/1.45 Consolas, "Cascadia Mono", monospace;
        white-space: pre-wrap;
      }

      @media (max-width: 820px) {
        header,
        .layout,
        .grid {
          grid-template-columns: 1fr;
        }

        header {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Message Automation Hub</h1>
          <p class="muted" id="env-path"></p>
        </div>
        <span class="status" id="bot-status">Loading</span>
      </header>

      <div class="layout">
        <div class="stack">
          <section>
            <h2>Settings</h2>
            <form id="settings-form">
              <div class="grid">
                <label>
                  WhatsApp phone number
                  <input name="whatsappPhoneNumber" autocomplete="off">
                </label>
                <label>
                  Secret store
                  <select name="messageHubSecretStore">
__SECRET_STORE_OPTIONS__
                  </select>
                </label>
                <label>
                  Secret file
                  <input name="messageHubSecretFile" autocomplete="off">
                </label>
                <label>
                  SMTP host
                  <input name="smtpHost" autocomplete="off">
                </label>
                <label>
                  SMTP port
                  <input name="smtpPort" inputmode="numeric" autocomplete="off">
                </label>
                <label>
                  SMTP secure
                  <select name="smtpSecure">
                    <option value="true">true</option>
                    <option value="false">false</option>
                  </select>
                </label>
                <label>
                  SMTP user
                  <input name="smtpUser" autocomplete="username">
                </label>
                <label>
                  Email from
                  <input name="emailFrom" autocomplete="email">
                </label>
                <label>
                  Email to
                  <input name="emailTo" autocomplete="email">
                </label>
                <label>
                  Email message ID domain
                  <input name="emailMessageIdDomain" autocomplete="off">
                </label>
                <label>
                  Forward statuses
                  <select name="whatsappForwardStatusesEnabled">
                    <option value="false">disabled</option>
                    <option value="true">enabled</option>
                  </select>
                </label>
                <label>
                  Status whitelist
                  <input name="whatsappForwardStatusWhitelist" autocomplete="off">
                </label>
                <label>
                  Status blacklist
                  <input name="whatsappForwardStatusBlacklist" autocomplete="off">
                </label>
                <label>
                  Forward groups
                  <select name="whatsappForwardGroupsEnabled">
                    <option value="false">disabled</option>
                    <option value="true">enabled</option>
                  </select>
                </label>
                <label>
                  Group whitelist
                  <input name="whatsappForwardGroupWhitelist" autocomplete="off">
                </label>
                <label>
                  Group blacklist
                  <input name="whatsappForwardGroupBlacklist" autocomplete="off">
                </label>
                <label>
                  Email to WhatsApp
                  <select name="emailToWhatsappEnabled">
                    <option value="false">disabled</option>
                    <option value="true">enabled</option>
                  </select>
                </label>
                <label>
                  Command subject prefix
                  <input name="emailToWhatsappSubjectPrefix" autocomplete="off">
                </label>
                <label>
                  Poll seconds
                  <input name="emailToWhatsappPollSeconds" inputmode="numeric" autocomplete="off">
                </label>
                <label>
                  Transaction category request
                  <select name="transactionCategoryRequestEnabled">
                    <option value="false">disabled</option>
                    <option value="true">enabled</option>
                  </select>
                </label>
                <label>
                  Transaction category prefix
                  <input name="transactionCategoryRequestSubjectPrefix" autocomplete="off">
                </label>
                <label>
                  Transaction category recipient
                  <input name="transactionCategoryRequestRecipientPhoneNumber" autocomplete="off">
                </label>
                <label>
                  IMAP host
                  <input name="imapHost" autocomplete="off">
                </label>
                <label>
                  IMAP port
                  <input name="imapPort" inputmode="numeric" autocomplete="off">
                </label>
                <label>
                  IMAP secure
                  <select name="imapSecure">
                    <option value="true">true</option>
                    <option value="false">false</option>
                  </select>
                </label>
                <label>
                  IMAP user
                  <input name="imapUser" autocomplete="username">
                </label>
              </div>
              <div class="actions">
                <button class="primary" type="submit">Save Settings</button>
                <button class="secondary" id="test-email" type="button">Send Test Email</button>
                <span class="notice" id="settings-notice"></span>
              </div>
            </form>
          </section>

          <section>
            <h2>SMTP Password</h2>
            <form id="secret-form">
              <label>
                New SMTP app password
                <input name="password" type="password" autocomplete="new-password">
              </label>
              <div class="actions">
                <button class="primary" type="submit">Save Password</button>
                <button class="danger" id="delete-secret" type="button">Delete Password</button>
                <span class="status" id="secret-status">Loading</span>
                <span class="notice" id="secret-notice"></span>
              </div>
            </form>
          </section>
        </div>

        <div class="stack">
          <section>
            <h2>Run</h2>
            <div class="actions">
              <button class="primary" id="start-bot" type="button">Start Bot</button>
              <button class="secondary" id="request-pairing-code" type="button">Request Pairing Code</button>
              <button class="secondary" id="stop-bot" type="button">Stop Bot</button>
              <span class="notice" id="run-notice"></span>
            </div>
          </section>

          <section>
            <div class="section-heading">
              <h2>Logs</h2>
              <button class="secondary" id="copy-logs" type="button">Copy Logs</button>
            </div>
            <pre id="logs"></pre>
          </section>
        </div>
      </div>
    </main>

    <script>
      const token = __TOKEN__;
      const form = document.querySelector("#settings-form");
      const secretForm = document.querySelector("#secret-form");
      const settingsNotice = document.querySelector("#settings-notice");
      const secretNotice = document.querySelector("#secret-notice");
      const runNotice = document.querySelector("#run-notice");
      const logs = document.querySelector("#logs");
      let latestLogText = "";

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "content-type": "application/json",
            "x-settings-token": token,
            ...(options.headers ?? {}),
          },
        });

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ?? "Request failed");
        }

        return body;
      }

      function readSettings() {
        const settings = Object.fromEntries(
          [...new FormData(form)].map(([key, value]) => [key, value.trim()]),
        );

        for (const key of ["smtpSecure", "whatsappForwardStatusesEnabled", "whatsappForwardGroupsEnabled", "emailToWhatsappEnabled", "transactionCategoryRequestEnabled", "imapSecure"]) {
          settings[key] = settings[key] === "true";
        }

        return settings;
      }

      function renderState(state) {
        document.querySelector("#env-path").textContent = state.envFilePath;
        document.querySelector("#secret-status").textContent =
          state.secrets.smtpPasswordConfigured ? "configured" : "missing";
        renderBot(state.bot);

        for (const [key, value] of Object.entries(state.settings)) {
          form[key].value = String(value ?? "");
        }
      }

      function renderBot(bot) {
        document.querySelector("#bot-status").textContent = bot.status;
        const isStartingOrRunning = bot.status === "starting" || bot.status === "running";
        document.querySelector("#start-bot").disabled = isStartingOrRunning;
        document.querySelector("#request-pairing-code").disabled = bot.status !== "running";
        document.querySelector("#stop-bot").disabled = bot.status === "stopped";

        const nextLogText = bot.logs.join("\\n");
        latestLogText = nextLogText;

        if (logs.textContent === nextLogText || isSelectingLogs()) {
          return;
        }

        const shouldStickToBottom =
          logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 8;

        logs.textContent = nextLogText;

        if (shouldStickToBottom) {
          logs.scrollTop = logs.scrollHeight;
        }
      }

      function isSelectingLogs() {
        const selection = window.getSelection();

        if (!selection || selection.isCollapsed) {
          return false;
        }

        return logs.contains(selection.anchorNode) || logs.contains(selection.focusNode);
      }

      async function refresh() {
        const state = await api("/api/state");
        renderState(state);
      }

      async function runAction(notice, pending, action) {
        notice.className = "notice";
        notice.textContent = pending;

        try {
          notice.textContent = await action();
        } catch (error) {
          notice.className = "notice error";
          notice.textContent = error.message;
        }
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        await runAction(settingsNotice, "Saving...", async () => {
          renderState(await api("/api/settings", {
            method: "PUT",
            body: JSON.stringify({ settings: readSettings() }),
          }));
          return "Saved.";
        });
      });

      secretForm.addEventListener("submit", async event => {
        event.preventDefault();
        await runAction(secretNotice, "Saving...", async () => {
          renderState(await api("/api/secrets/smtp-password", {
            method: "POST",
            body: JSON.stringify({ password: secretForm.password.value }),
          }));
          secretForm.password.value = "";
          return "Saved.";
        });
      });

      document.querySelector("#delete-secret").addEventListener("click", () =>
        runAction(secretNotice, "Deleting...", async () => {
          renderState(await api("/api/secrets/smtp-password", { method: "DELETE" }));
          return "Deleted.";
        }),
      );

      document.querySelector("#test-email").addEventListener("click", () =>
        runAction(settingsNotice, "Sending...", async () => {
          await api("/api/test-email", { method: "POST" });
          return "Test email sent.";
        }),
      );

      document.querySelector("#start-bot").addEventListener("click", () =>
        runAction(runNotice, "Starting...", async () => {
          renderBot(await api("/api/bot/start", { method: "POST" }));
          return "";
        }),
      );

      document.querySelector("#request-pairing-code").addEventListener("click", () =>
        runAction(runNotice, "Requesting pairing code...", async () => {
          const result = await api("/api/bot/pairing-code", { method: "POST" });
          await refresh();
          return "Pairing code: " + result.code;
        }),
      );

      document.querySelector("#stop-bot").addEventListener("click", () =>
        runAction(runNotice, "Stopping...", async () => {
          renderBot(await api("/api/bot/stop", { method: "POST" }));
          return "";
        }),
      );

      document.querySelector("#copy-logs").addEventListener("click", () =>
        runAction(runNotice, "Copying logs...", async () => {
          await navigator.clipboard.writeText(latestLogText);
          return "Logs copied.";
        }),
      );

      setInterval(async () => {
        try {
          renderBot(await api("/api/bot"));
        } catch {
        }
      }, __POLL_INTERVAL__);

      refresh().catch(error => {
        settingsNotice.className = "notice error";
        settingsNotice.textContent = error.message;
      });
    </script>
  </body>
</html>
