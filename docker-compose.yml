services:
  hub:
    image: ghcr.io/dlipson/message-automation-hub:${MESSAGE_HUB_IMAGE_TAG:-stage}
    container_name: message-automation-hub
    restart: unless-stopped
    logging:
      driver: journald
    env_file:
      - path: .env
        required: false
    environment:
      MESSAGE_HUB_SECRET_STORE: file
      MESSAGE_HUB_SECRET_FILE: /run/secrets/message-hub/secrets.json
      EMAIL_THREAD_STORE_FILE: /data/thread-store.json
      IMAP_CHECKPOINT_FILE: /data/imap-checkpoint.json
      WHATSAPP_CATCH_UP_STORE_FILE: /data/whatsapp-catch-up.json
      PENDING_GROUP_INVITE_STORE_FILE: /data/pending-group-invites.json
      MESSAGE_HUB_BOT_CONTROL_PORT: 8788
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - whatsapp-session:/app/.wwebjs_auth
      - stage-data:/data
      - ./secrets:/run/secrets/message-hub:ro

volumes:
  whatsapp-session:
  stage-data:
